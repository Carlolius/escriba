[project]
name = "escriba"
version = "0.2.0"
description = "Grabar, transcribir e identificar hablantes en reuniones (local o en la nube)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "soundfile>=0.12",          # WAV y Ogg/Opus sin ffmpeg (libsndfile viene en la wheel)
    "soundcard>=0.4.4",         # grabar y reproducir: WASAPI en Windows, PulseAudio/PipeWire en Linux
    "requests",
    "rich",
    "questionary",
    "psutil",
    "platformdirs",
    "nicegui>=4",              # interfaz web
    # Identificación por voz (también en modo nube: se hace en local)
    "resemblyzer",
    "webrtcvad-wheels",         # sustituye a webrtcvad, que en Windows necesita compilador
    "setuptools<81",            # webrtcvad usa pkg_resources, eliminado en setuptools 81
]

[project.optional-dependencies]
# Transcripción y diarización en este PC (pesado: torch + modelos)
local = [
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3",
]

[project.scripts]
escriba = "escriba.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["escriba"]

[tool.uv]
# resemblyzer pide "webrtcvad", que no tiene wheels para Windows; webrtcvad-wheels
# instala el mismo módulo. Esta marca nunca se cumple, así que no se instala.
override-dependencies = ["webrtcvad; sys_platform == 'never'"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
