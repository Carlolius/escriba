[project]
name = "escriba"
version = "0.3.1"
description = "Record, transcribe and identify speakers in meetings, locally or in the cloud"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "soundfile>=0.12",          # WAV and Ogg/Opus without ffmpeg (libsndfile ships in the wheel)
    "soundcard>=0.4.4",         # record and play: WASAPI on Windows, PulseAudio/PipeWire on Linux
    "requests",
    "rich",
    "questionary",
    "psutil",
    "platformdirs",
    "nicegui>=4,<5",              # web interface
]

[project.optional-dependencies]
# Transcription and diarization on this PC (heavy: torch + models)
local = [
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3",
]

[project.scripts]
escriba = "escriba.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["escriba"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # fixed, so newer ruff versions don't change the rules
