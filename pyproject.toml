[project]
name = "escriba"
version = "0.2.0"
description = "Record, transcribe and identify speakers in meetings, locally or in the cloud"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "soundfile>=0.12",          # WAV and Ogg/Opus without ffmpeg (libsndfile ships in the wheel)
    "soundcard>=0.4.4",         # record and play: WASAPI on Windows, PulseAudio/PipeWire on Linux
    "requests",
    "rich",
    "questionary",
    "psutil",
    "platformdirs",
    "nicegui>=4",              # web interface
    # Voice identification (also in cloud mode: it runs locally)
    "resemblyzer",
    "webrtcvad-wheels",         # replaces webrtcvad, which needs a compiler on Windows
    "setuptools<81",            # webrtcvad uses pkg_resources, removed in setuptools 81
]

[project.optional-dependencies]
# Transcription and diarization on this PC (heavy: torch + models)
local = [
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3",
]

[project.scripts]
escriba = "escriba.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["escriba"]

[tool.uv]
# resemblyzer asks for "webrtcvad", which has no Windows wheels; webrtcvad-wheels
# installs the same module. This marker is never true, so it's never installed.
override-dependencies = ["webrtcvad; sys_platform == 'never'"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
