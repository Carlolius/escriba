name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install -e . pytest
      - name: Tests
        shell: bash
        run: uv run --no-sync python -m pytest -v

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.ps1
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File install.ps1 -NoPause
      - name: Check what was installed
        shell: powershell
        run: |
          $exe = Join-Path $env:USERPROFILE '.local\bin\escriba.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Escriba.lnk'
          if (-not (Test-Path $lnk)) { throw "Missing shortcut $lnk" }
          & $exe data
          if ($LASTEXITCODE -ne 0) { throw 'escriba data failed' }
          $web = Start-Process $exe -ArgumentList 'web', '--no-browser' -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest 'http://127.0.0.1:8765/settings' -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          taskkill /PID $web.Id /T /F | Out-Null   # the whole tree: escriba.exe starts python.exe
          if (-not $ok) { throw "The web didn't answer" }
      - name: Uninstall
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File install.ps1 -Uninstall -NoPause
          if (Test-Path (Join-Path $env:USERPROFILE '.local\bin\escriba.exe')) { throw 'Still installed' }
