name: GPU test report
description: Tell us how local mode went on your NVIDIA card, whether it worked or not.
labels: [gpu]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! GPU support is experimental and every report helps.
        **Don't attach recordings or transcripts.** The log and the timings are enough.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - It used the GPU
        - It fell back to the CPU
        - It failed
    validations:
      required: true
  - type: textarea
    id: smi
    attributes:
      label: Output of nvidia-smi
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and escriba version
      placeholder: Windows 11, v0.3.0
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How you installed it
      placeholder: install.ps1 -Gpu
  - type: textarea
    id: log
    attributes:
      label: Transcription log
      description: The messages shown while transcribing (Transcribe page or terminal).
      render: text
    validations:
      required: true
  - type: input
    id: timing
    attributes:
      label: Audio length and time it took
      placeholder: 30 min of audio, 3 min
